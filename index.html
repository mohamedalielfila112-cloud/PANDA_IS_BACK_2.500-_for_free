<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚠️ تحذير أمني خطير - نظام متهور</title>

    <!-- وسوم المعاينة الخارجية (تظهر عند مشاركة الرابط مع صورة الباندا الهاكر) -->
    <meta property="og:title" content="⚠️ تم اختراق هاتفك بالكامل بواسطة باندا الهاكر! ⚠️" />
    <meta property="og:description" content="تم تجميد النظام وسحب الكاميرا والبيانات! أدخل الكود فوراً لإنقاذ هاتفك." />
    <meta property="og:image" content="hacked.jpg" />
    <meta property="og:type" content="website" />
    
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="⚠️ تم اختراق هاتفك بالكامل بواسطة باندا الهاكر! ⚠️">
    <meta name="twitter:description" content="تم تجميد النظام وسحب الكاميرا والبيانات! أدخل الكود فوراً لإنقاذ هاتفك.">
    <meta name="twitter:image" content="hacked.jpg">

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            color: #ff0000;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            transition: background-color 0.2s ease;
        }
        /* تأثير الوميض الأحمر عند الخطأ */
        body.error-flash {
            animation: flashBg 0.3s ease 3;
        }
        @keyframes flashBg {
            0% { background-color: #000; }
            50% { background-color: #550000; }
            100% { background-color: #000; }
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.3;
        }
        .hack-table {
            border: 2px solid #ff0000;
            background-color: rgba(10, 5, 5, 0.96);
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 0 40px rgba(255, 0, 0, 0.9);
            z-index: 10;
            max-width: 85%;
            transition: transform 0.1s ease;
        }
        /* اهتزاز الصندوق */
        .shake {
            animation: shakeBox 0.4s ease;
        }
        @keyframes shakeBox {
            0% { transform: translate(0, 0); }
            20% { transform: translate(-10px, 5px); }
            40% { transform: translate(10px, -5px); }
            60% { transform: translate(-10px, -5px); }
            80% { transform: translate(10px, 5px); }
            100% { transform: translate(0, 0); }
        }

        .panda-hacker {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 3px solid #ff0000;
            object-fit: cover;
            margin-bottom: 12px;
            box-shadow: 0 0 20px #ff0000;
            animation: pulsePanda 1.5s infinite alternate;
        }
        @keyframes pulsePanda {
            0% { box-shadow: 0 0 10px #ff0000; }
            100% { box-shadow: 0 0 25px #ff0000, inset 0 0 15px #ff0000; }
        }

        h1 {
            font-size: 21px;
            margin-bottom: 12px;
            text-shadow: 0 0 12px #ff0000;
        }
        p {
            color: #00ff00;
            text-shadow: 0 0 6px #00ff00;
            font-size: 13px;
        }
        #warningText {
            color: #ff3333;
            font-weight: bold;
            text-shadow: 0 0 8px #ff0000;
            min-height: 20px;
            margin-bottom: 10px;
        }
        input {
            padding: 11px;
            font-size: 16px;
            background-color: #111;
            border: 1px solid #ff0000;
            color: #fff;
            text-align: center;
            border-radius: 5px;
            outline: none;
            width: 85%;
            margin-top: 5px;
        }
        button {
            padding: 10px 22px;
            margin-top: 15px;
            background-color: #ff0000;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(255,0,0,0.5);
        }
        button:hover {
            background-color: #cc0000;
        }
    </style>
</head>
<body onclick="initExperience()">

    <canvas id="matrix"></canvas>

    <table class="hack-table" id="prankContainer">
        <tr>
            <td>
                <img src="hacked.jpg" alt="Panda Hacker" class="panda-hacker">
                <h1>⚠️ تم اختراق هاتفك بواسطة باندا الهاكر! ⚠️</h1>
                <p>تم سحب الملفات، الكاميرا، وكلمات المرور بنجاح!</p>
                <div id="warningText">أنقر في أي مكان لتفعيل طوق النجاة...</div>
                <input type="password" id="secCode" placeholder="أدخل كود الفك السري...">
                <br>
                <button onclick="unlockPhone()">إلغاء القفل وطرد الهاكر</button>
            </td>
        </tr>
    </table>

    <script>
        let audioCtx = null;
        let isStarted = false;

        // تهيئة الأصوات المرعبة باستخدام موجات رقمية (لا تحتاج لملفات خارجية)
        function initExperience() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {});
            }
            if (!isStarted) {
                isStarted = true;
                document.getElementById("warningText").innerText = "⚠️ النظام مجمد بالكامل! أدخل الكود السري:";
                startScaryAudio();
            }
        }

        function startScaryAudio() {
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                // تشغيل نغمة إنذار منخفضة ومرعبة في الخلفية
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(60, audioCtx.currentTime); // صوت منخفض مرعب
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
            } catch(e) {}
        }

        // تأثير صوت الخطأ (صفارة إنذار حادة)
        function playErrorSound() {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } catch(e) {}
        }

        // تأثير خلفية الماتريكس
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        canvas.height = window.innerHeight;
        canvas.width = window.innerWidth;

        const chars = "01010101PANDAHACKERSYSTEMWARNINGDELETED";
        const alphabet = chars.split("");
        const font_size = 14;
        const columns = canvas.width / font_size;
        const drops = [];
        for (let x = 0; x < columns; x++) { drops[x] = 1; }

        function drawMatrix() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#ff0000"; // لون أحمر مرعب للماتريكس
            ctx.font = font_size + "px monospace";
            for (let i = 0; i < drops.length; i++) {
                const text = alphabet[Math.floor(Math.random() * alphabet.length)];
                ctx.fillText(text, i * font_size, drops[i] * font_size);
                if (drops[i] * font_size > canvas.height && Math.random() > 0.975) { drops[i] = 0; }
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 25);

        // وظيفة فحص الكود
        function unlockPhone() {
            var inputVal = document.getElementById("secCode").value;
            if (inputVal === "2004") {
                if (document.fullscreenElement) {
                    document.exitFullscreen().catch(err => {});
                }
                document.getElementById("prankContainer").innerHTML = "<h1 style='color: #00ff00; text-shadow: 0 0 20px #00ff00;'>🐼😂 كفو! تم طرد باندا الهاكر ونجح المقلب بامتياز!</h1>";
                setTimeout(() => {
                    document.body.style.backgroundColor = "#ffffff";
                    canvas.style.display = "none";
                }, 3000);
            } else {
                // تشغيل صوت الخطأ + اهتزاز الهاتف + ومضات الشاشة الحمراء
                playErrorSound();
                
                if (navigator.vibrate) {
                    navigator.vibrate([600, 200, 600, 200, 600]); // اهتزاز قوي ومتكرر
                }

                // إضافة تأثيرات الاهتزاز والوميض على الصفحة
                let container = document.getElementById("prankContainer");
                container.classList.add("shake");
                document.body.classList.add("error-flash");

                setTimeout(() => {
                    container.classList.remove("shake");
                    document.body.classList.remove("error-flash");
                }, 600);

                document.getElementById("warningText").innerText = "❌ كود خاطئ! تحذير: بدأ العد التنازلي لحذف الصور!";
            }
        }
    </script>

</body>
</html>
