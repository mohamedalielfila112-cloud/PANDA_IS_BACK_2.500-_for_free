<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تنبيه أمني خطير</title>

    <!-- وسوم المعاينة الخارجية (تظهر عند مشاركة الرابط) -->
    <meta property="og:title" content="⚠️ تنبيه أمني خطير ⚠️" />
    <meta property="og:description" content="لقد تم تجميد نظام جهازك بالكامل! أدخل الكود لإلغاء القفل." />
    <meta property="og:image" content="hacked.jpg" />
    <meta property="og:type" content="website" />
    
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="⚠️ تنبيه أمني خطير ⚠️">
    <meta name="twitter:description" content="لقد تم تجميد نظام جهازك بالكامل! أدخل الكود لإلغاء القفل.">
    <meta name="twitter:image" content="hacked.jpg">

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            color: #ff0000;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.25;
        }
        .hack-table {
            border: 2px solid #ff0000;
            background-color: rgba(10, 10, 10, 0.95);
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.8);
            z-index: 10;
        }
        h1 {
            font-size: 26px;
            margin-bottom: 20px;
            text-shadow: 0 0 10px #ff0000;
        }
        p {
            color: #00ff00;
            text-shadow: 0 0 5px #00ff00;
        }
        input {
            padding: 10px;
            font-size: 16px;
            background-color: #111;
            border: 1px solid #ff0000;
            color: #fff;
            text-align: center;
            border-radius: 5px;
            outline: none;
            width: 80%;
        }
        button {
            padding: 10px 20px;
            margin-top: 15px;
            background-color: #ff0000;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #cc0000;
        }
    </style>
</head>
<body onclick="goFullscreen()">

    <canvas id="matrix"></canvas>

    <table class="hack-table" id="prankContainer">
        <tr>
            <td>
                <h1>⚠️ تم اختراق جهازك بالكامل ⚠️</h1>
                <p>تم تجميد النظام وسحب البيانات!</p>
                <p style="font-size: 13px; margin-bottom: 15px;">انقر على الشاشة وأدخل كود الأمان للإلغاء:</p>
                <input type="password" id="secCode" placeholder="أدخل الكود...">
                <br>
                <button onclick="unlockPhone()">إلغاء القفل</button>
            </td>
        </tr>
    </table>

    <script>
        // إجبار المتصفح على الدخول في وضع ملء الشاشة عند أول ضغطة
        function goFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {});
            }
        }

        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        canvas.height = window.innerHeight;
        canvas.width = window.innerWidth;

        const chinese = "0101010101010101ABCDEFhackSYSTEMrootWARNING";
        const alphabet = chinese.split("");
        const font_size = 14;
        const columns = canvas.width / font_size;
        const drops = [];
        for (let x = 0; x < columns; x++) { drops[x] = 1; }

        function drawMatrix() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#0F0";
            ctx.font = font_size + "px monospace";
            for (let i = 0; i < drops.length; i++) {
                const text = alphabet[Math.floor(Math.random() * alphabet.length)];
                ctx.fillText(text, i * font_size, drops[i] * font_size);
                if (drops[i] * font_size > canvas.height && Math.random() > 0.975) { drops[i] = 0; }
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 30);

        function unlockPhone() {
            var inputVal = document.getElementById("secCode").value;
            if (inputVal === "panda_is_here") {
                if (document.fullscreenElement) {
                    document.exitFullscreen().catch(err => {});
                }
                document.getElementById("prankContainer").innerHTML = "<h1 style='color: #00ff00; text-shadow: 0 0 15px #00ff00;'>😂 مبروك! نجح المقلب يا وحش</h1>";
                setTimeout(() => {
                    document.body.style.backgroundColor = "#ffffff";
                    canvas.style.display = "none";
                }, 2000);
            } else {
                alert("❌ كود خاطئ! تحذير: سيتم فرمتة الجهاز...");
            }
        }
    </script>

</body>
</html>
